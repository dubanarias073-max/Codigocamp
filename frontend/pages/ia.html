<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="/js/i18n.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA · CódigoCamp</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d1b1a">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CódigoCamp">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/js/carga.js"></script>
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/tema.css">
  <link rel="stylesheet" href="/css/ia.css">
</head>
<body class="cargando pag-ia">
  <div class="app ancho">
    <nav class="lado" id="lado" aria-label="Principal"></nav>
    <main class="centro" id="contenido">
      <h1 class="titulo-pag">Tutor de IA</h1>
      <div class="ia-cuerpo">
        <aside class="ia-lista" id="iaLista" aria-label="Tus conversaciones">
          <div class="ia-lista-cab"><b>Tutor de IA</b><button class="ia-ico ia-solo-movil" id="cerrarLista" type="button" aria-label="Cerrar la lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
          <button class="ia-nueva" id="nueva" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva conversación</button>
          <label class="ia-buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="buscarConv" type="search" placeholder="Buscar en tus chats" aria-label="Buscar conversaciones" autocomplete="off"></label>
          <nav class="ia-convs" id="convs" aria-label="Conversaciones guardadas"><p class="nota">Cargando…</p></nav>
        </aside>
        <div class="ia-velo" id="velo" hidden></div>
        <section class="ia vacia" id="ia" aria-label="Conversación con el tutor">
          <header class="ia-cab">
            <button class="ia-ico ia-menu-btn" id="verLista" type="button" aria-controls="iaLista" aria-expanded="false" aria-label="Tus conversaciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
            <h2 id="tituloConv">Conversación nueva</h2>
            <div class="ia-cab-btns" id="cabBtns" hidden>
              <button class="ia-ico" type="button" data-conv="renombrar" aria-label="Renombrar" title="Renombrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>Renombrar</span></button>
              <button class="ia-ico" type="button" data-conv="fijar" aria-label="Fijar" title="Fijar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg><span>Fijar</span></button>
              <button class="ia-ico" type="button" data-conv="borrar" aria-label="Borrar" title="Borrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span>Borrar</span></button>
            </div>
            <button class="ia-ico ia-mas" id="masConv" type="button" aria-label="Opciones de la conversación" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
            <button class="ia-ico ia-solo-movil" id="nuevaCab" type="button" aria-label="Nueva conversación" title="Nueva conversación"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </header>
          <div class="ia-scroll" id="scroll">
            <div class="ia-bienvenida" id="bienvenida">
              <span class="ia-codi" id="iaCodi"><img src="/img/codi/saludo.svg" alt="Codi" width="110" height="110"></span>
              <h3 id="saludo">¿En qué te ayudo hoy?</h3>
              <p id="saludoSub">Pregunta lo que quieras, pega tu código o adjunta archivos.</p>
            </div>
            <div class="ia-log" id="log" aria-live="polite"></div>
          </div>
          <div class="ia-pie">
            <form class="ia-caja" id="f">
              <div class="adj-bandeja" id="bandeja" hidden aria-label="Archivos para la IA"></div>
              <textarea id="q" rows="1" maxlength="12000" placeholder="Escribe tu pregunta…" aria-label="Tu pregunta" enterkeyhint="send"></textarea>
              <div class="ia-caja-barra">
                <button class="ia-ico adj-clip" id="clip" type="button" title="Adjuntar imágenes, capturas, PDF, video, audio o código (hasta 1 GB)" aria-label="Adjuntar archivos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"/></svg></button>
                <input type="file" id="archivosIa" multiple hidden>
                <button class="ia-ico" id="codigo" type="button" title="Insertar un bloque de código" aria-label="Insertar un bloque de código"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
                <small id="cuenta" hidden></small>
                <button class="ia-enviar" id="enviar" type="submit" aria-label="Enviar" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
              </div>
            </form>
            <div class="sugerencias" id="sug"></div>
            <p class="ia-aviso">La IA puede equivocarse: revisa lo que te responde.</p>
          </div>
        </section>
      </div>
    </main>
    <aside class="der" id="der" aria-label="Tus estadísticas"></aside>
  </div>
  <nav class="inf" id="inf" aria-label="Principal"></nav>
  <script type="module" src="/js/ia.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
