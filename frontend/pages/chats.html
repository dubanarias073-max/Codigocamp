<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="/js/i18n.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chats · CódigoCamp</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d1b1a">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CódigoCamp">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/js/carga.js"></script>
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/tema.css">
  <link rel="stylesheet" href="/css/chats.css">
</head>
<body class="cargando pag-chats">
  <div class="app ancho">
    <nav class="lado" id="lado" aria-label="Principal"></nav>
    <main class="centro" id="contenido">
      <h1 class="titulo-pag">Chats</h1>
      <div class="chats-grid" id="cg">
        <aside class="c-lista" id="cLista" aria-label="Amigos">
          <div class="c-lista-cab"><h2>Chats</h2><button class="c-ico c-hamb" id="cerrarAmigos" type="button" aria-label="Cerrar la lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
          <div class="c-yo">
            <span class="c-av" id="miAv">?</span>
            <div class="c-yo-txt"><small>Tu ID</small><b id="miCodigo">······</b><small id="miAlias"></small></div>
            <button class="c-ico" id="copiar" type="button" title="Copiar tu ID" aria-label="Copiar tu ID"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
            <button class="c-btn pri" id="invitar" type="button" title="Copiar enlace de invitación"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Invitar</button>
          </div>
          <button class="c-contactos" id="contactos" type="button">📇 Buscar en mis contactos</button>
          <form class="c-add" id="fAgregar">
            <label class="c-buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="quien" maxlength="30" placeholder="Busca por nombre, @usuario o ID" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar personas por nombre, usuario o ID"></label>
            <button class="c-btn" type="submit">Agregar</button>
          </form>
          <div class="c-scroll">
            <div id="resultados" class="c-res" aria-live="polite"></div>
            <div id="solicitudes"></div>
            <div id="amigos"></div>
          </div>
        </aside>
        <section class="c-conv" aria-label="Conversación">
          <div class="c-vacio" id="vacio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18l-1.5 3 4-1.5A9 9 0 1 0 5 18z"/></svg><b>Tus conversaciones</b><span>Elige un amigo para chatear o agrega a alguien con su @usuario o ID.</span><button class="c-btn pri c-hamb" id="verAmigos2" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Ver mis chats</button></div>
          <div class="c-velo" id="cVelo" hidden></div>
          <header class="c-cab" id="cab" hidden>
            <button class="c-ico c-hamb" id="verAmigos" type="button" aria-controls="cLista" aria-label="Tus chats" title="Tus chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
            <button class="c-ico c-volver" id="volver" type="button" aria-label="Volver a la lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <span class="c-av" id="cAv"></span>
            <div class="c-cab-txt"><b id="cNombre"></b><small id="cAlias"></small></div>
            <button class="c-ico" id="cMas" type="button" aria-label="Opciones" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg></button>
            <div class="c-menu" id="cMenu" hidden><button id="verPerfil" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Ver perfil</button><button id="borrarChat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/><path d="M9 9l6 4M15 9l-6 4"/></svg>Eliminar chat (solo para mí)</button><button id="quitar" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Quitar amigo</button></div>
          </header>
          <div class="c-log" id="log" aria-live="polite" hidden></div>
          <div class="c-abajo">
            <div class="c-emojis" id="emojis" hidden aria-label="Emojis rápidos"></div>
            <div class="adj-bandeja" id="bandeja" hidden aria-label="Archivos para enviar"></div>
            <form class="c-form" id="fMsg" hidden>
              <button type="button" class="c-ico adj-clip" id="clip" title="Adjuntar fotos, videos o archivos (hasta 1 GB)" aria-label="Adjuntar archivos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"/></svg></button>
              <input type="file" id="archivosMsg" multiple hidden>
              <div class="c-campo"><input id="texto" maxlength="300" placeholder="Mensaje" autocomplete="off" aria-label="Mensaje" enterkeyhint="send"><button type="button" class="c-ico" id="verEmojis" aria-label="Emojis" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button></div>
              <button class="c-enviar" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            </form>
          </div>
        </section>
      </div>
    </main>
    <dialog class="dlg-contactos dlg-perfil" id="dlgPerfil" aria-labelledby="pfNombre">
      <header><h2>Perfil</h2><button class="c-ico" type="button" id="dlgPerfilCerrar" aria-label="Cerrar">✕</button></header>
      <div id="pfCuerpo" class="pf-cuerpo"></div>
    </dialog>
    <dialog class="dlg-contactos" id="dlgContactos" aria-labelledby="dlgContTit">
      <header><h2 id="dlgContTit">Tus contactos</h2><button class="c-ico" type="button" id="dlgContCerrar" aria-label="Cerrar">✕</button></header>
      <p class="nota" id="dlgContNota">Elige contactos de tu teléfono para ver quién ya está en CódigoCamp o invitarlos. No guardamos tu agenda.</p>
      <div id="dlgContCuerpo"></div>
    </dialog>
    <aside class="der" id="der" aria-label="Tus estadísticas"></aside>
  </div>
  <nav class="inf" id="inf" aria-label="Principal"></nav>
  <script type="module" src="/js/chats.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
