<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · CódigoCamp</title>
  <meta name="description" content="Crea una nueva contraseña para tu cuenta de CódigoCamp.">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d1b1a">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CódigoCamp">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/js/carga.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/portada.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="cargando">
  <header class="bar scrolled">
    <a class="logo" href="/"><img src="/img/logo-icon.png" alt="" width="38" height="38"><span class="logo-txt">codigocamp</span></a>
    <div class="userbar"><a class="btn ghost sm" href="/pages/login.html">← Iniciar sesión</a></div>
  </header>

  <main class="acceso-pag">
    <div class="llaves" aria-hidden="true">{ }</div>
    <div class="acceso-in restablecer-in">
      <div class="card authbox">
        <h2>Crea una nueva contraseña</h2>
        <p class="note" id="paraQuien">Comprobando el enlace…</p>
        <form id="formAcceso" class="authform" novalidate hidden>
          <label for="password">Nueva contraseña <small>mínimo 6 caracteres, una mayúscula y un número</small>
            <span class="pw">
              <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Tu nueva contraseña">
              <button type="button" class="pw-ver" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
                <svg class="ojo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ojo-x" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.7C3.9 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </span>
          </label>
          <label for="password2">Repite la contraseña
            <input type="password" id="password2" name="password2" required autocomplete="new-password" placeholder="Otra vez, para confirmar">
          </label>
          <button class="btn pri" type="submit" id="btnGuardar">Guardar contraseña</button>
        </form>
        <p id="autherr" class="err" role="alert" aria-live="assertive"></p>
        <p class="cambio" id="pedirOtro" hidden><a href="/pages/login.html#olvide">Pedir un enlace nuevo</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/restablecer.js"></script>
</body>
</html>
