<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070a14">
  <title>Panel de administrador · CódigoCamp</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/tienda.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/vitrina.css">
</head>
<body class="adm">
  <!-- Clave de administrador -->
  <section id="bloqueo" class="a-clave" hidden>
    <form id="formClave" class="a-clave-caja">
      <img src="/img/logo-icon.png" alt="" width="56" height="56">
      <h1>Panel de administrador</h1>
      <p class="a-sub">Escribe tu clave de administrador para continuar.</p>
      <input type="password" id="clave" autocomplete="off" placeholder="ADMIN_CLAVE" required>
      <button class="a-btn pri ancho" type="submit">Entrar al panel</button>
      <p class="a-err" id="errClave" role="alert"></p>
      <a class="a-link" href="/pages/inicio.html">← Volver a mi cuenta</a>
    </form>
  </section>

  <div id="app" class="a-app" hidden>
    <aside class="a-side" id="side" aria-label="Menú del panel">
      <a class="a-marca" href="#resumen"><img src="/img/logo-icon.png" alt="" width="34" height="34"><span><b>codigocamp</b><small>Administrador</small></span></a>
      <nav class="a-nav" id="nav"></nav>
      <div class="a-side-pie">
        <a class="a-btn ghost ancho" href="/pages/inicio.html">👤 Ir a mi cuenta</a>
        <button class="a-btn ghost ancho" type="button" id="salirAdmin">⏻ Salir del panel</button>
      </div>
    </aside>
    <div class="a-velo" id="velo" hidden></div>
    <div class="a-cuerpo">
      <header class="a-top">
        <button class="a-icono a-solo-movil" type="button" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <button class="a-icono" type="button" id="atras" aria-label="Volver" hidden>←</button>
        <div class="a-titulos"><h1 id="titulo">Panel</h1><p id="subtitulo"></p></div>
        <div class="a-acciones" id="acciones"></div>
      </header>
      <main id="vista" class="a-main" tabindex="-1"></main>
    </div>
    <nav class="a-tabbar" id="tabbar" aria-label="Secciones principales"></nav>
  </div>

  <dialog id="hoja" class="a-hoja"><div class="a-hoja-caja" id="hojaCaja"></div></dialog>
  <div id="toast" class="a-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
