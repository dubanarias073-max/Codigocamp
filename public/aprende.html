<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat con el tutor IA · CódigoCamp</title>
  <script src="js/tema.js"></script>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="cargando" data-pagina="chat">
  <header class="bar">
    <a class="logo" href="index.html"><img src="img/logo-icon.png" alt="" width="38" height="38"><span class="logo-txt">codigocamp</span></a>
    <nav class="nav-sec" id="nav" aria-label="Secciones"></nav>
    <div class="userbar" id="userbar"></div>
    <button class="tema-btn" id="temaBtn" type="button" aria-label="Cambiar tema">☀️</button>
  </header>

  <main class="chatpage">
    <div class="chat-head">
      <div>
        <h1>Chat con tu tutor de IA</h1>
        <p class="note">Pregunta sobre cualquier lenguaje, HTML, CSS o bases de datos. Pega tu código y pídele que lo revise.</p>
      </div>
      <button id="nuevo" class="btn ghost sm" type="button">Nueva conversación</button>
    </div>
    <div class="card chatcard">
      <div class="chips" id="chips"></div>
      <div id="log" aria-live="polite"></div>
      <form class="send" id="f">
        <textarea id="q" rows="2" placeholder="Escribe tu pregunta… (Shift + Enter para una nueva línea)" maxlength="3500"></textarea>
        <button class="btn pri" id="b" type="submit">Enviar</button>
      </form>
      <p class="note" id="st"></p>
    </div>
  </main>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
