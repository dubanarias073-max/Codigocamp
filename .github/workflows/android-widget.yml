# Compila el widget de Android (apps/android-widget) en GitHub y deja el APK listo para descargar.
# GitHub → pestaña Actions → «Widget de Android» → la última ejecución → Artifacts → CodigoCamp-Widget-apk.
name: Widget de Android

on:
  push:
    paths:
      - "apps/android-widget/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-widget
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ya trae el SDK de Android (ANDROID_HOME) con las licencias aceptadas.
      - name: Revisar el SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::No hay SDK de Android en el runner"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Compilar el APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk CodigoCamp-Widget.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CodigoCamp-Widget-apk
          path: apps/android-widget/CodigoCamp-Widget.apk
          if-no-files-found: error
