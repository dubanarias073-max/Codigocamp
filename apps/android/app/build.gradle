plugins {
    id "com.android.application"
}

def urlServidor = (project.findProperty("codigocampUrl") ?: "https://codigocamp.taila41f89.ts.net").toString().trim().replaceAll('/+$', '')

android {
    namespace "com.codigocamp.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.codigocamp.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
        buildConfigField "String", "URL_SERVIDOR", "\"${urlServidor}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
